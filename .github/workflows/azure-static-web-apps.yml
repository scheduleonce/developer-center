name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - dev

jobs:
  build_and_deploy_production:
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.action != 'closed')
    uses: ./.github/workflows/deploy-azure-swa.yml
    with:
      docusaurus_url: https://developers.oncehub.com
    secrets:
      azure_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_DESERT_0513AD50F }}

  build_and_deploy_staging:
    if: |
      (github.event_name == 'push' && github.ref_name == 'dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev' && github.event.action != 'closed')
    uses: ./.github/workflows/deploy-azure-swa.yml
    with:
      docusaurus_url: https://developers.staticso2.com
    secrets:
      azure_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_MEADOW_0C0634100 }}

  close_pr_production:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    name: Close PR (main)
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_DESERT_0513AD50F }}
          action: "close"

  close_pr_staging:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    name: Close PR (dev)
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_MEADOW_0C0634100 }}
          action: "close"
