name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - dev

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: production
            branch: main
            azure_token_secret: AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_DESERT_0513AD50F
            docusaurus_url: https://developers.oncehub.com
          - environment: staging
            branch: dev
            azure_token_secret: AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_MEADOW_0C0634100
            docusaurus_url: https://developers.staticso2.com
    name: Build and Deploy (${{ matrix.environment }})
    if: |
      (github.event_name == 'push' && github.ref_name == matrix.branch) ||
      (github.event_name == 'pull_request' && github.base_ref == matrix.branch && github.event.action != 'closed')
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false
      - name: Check code formatting
        run: npm run prettier:check
      - name: Run typecheck
        run: npm run typecheck
      - name: Validate OpenAPI
        run: npm run openapi:validate
      - name: Build Docusaurus site
        run: npm run build
        env:
          DOCUSAURUS_URL: ${{ matrix.docusaurus_url }}
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[matrix.azure_token_secret] }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "build"
          skip_app_build: true

  close_pull_request_job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: main
            azure_token_secret: AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_DESERT_0513AD50F
          - branch: dev
            azure_token_secret: AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_MEADOW_0C0634100
    name: Close PR (${{ matrix.branch }})
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.base_ref == matrix.branch
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[matrix.azure_token_secret] }}
          action: "close"
